name: Error
description: Algo no funciona como debería. Pensado para que lo resuelva el agente de Copilot.
title: "[bug] "
labels: ["bug", "copilot"]
body:
  - type: markdown
    attributes:
      value: |
        Cada issue debe poder resolverse en **un solo PR pequeño**. Un error bien descrito
        (pasos exactos, esperado vs. actual) ahorra iteraciones del agente.
  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: Completa cada sección, o borra todo y pega el issue completo (por ejemplo, uno escrito con Claude).
      value: |
        ## Contexto
        _Dónde ocurre (página, módulo, función) y qué hay hoy en el código relacionado._

        ## Pasos para reproducir
        _Pasos numerados, o un caso de prueba mínimo (entrada concreta de la función afectada)._

        ## Comportamiento esperado

        ## Comportamiento actual
        _Lo que ocurre en realidad, con el mensaje de error o la salida si la hay._

        ## Qué hay que hacer
        _Arreglo propuesto, si lo conoces. Debe incluir un test que falle antes y pase después._

        ## Test que debe fallar primero
        _Obligatorio: el test que reproduce el error y fallará contra el código actual (archivo, caso y entrada concreta). El agente lo agrega en un commit `test:` antes del arreglo._

        ## Criterios de aceptación
        - [ ] Hay un test que reproduce el error y pasa con el arreglo
        - [ ] `npm run typecheck` pasa
        - [ ] `npm test` pasa

        ## Archivos probables

        ## Fuera de alcance
        _Lo que el agente NO debe tocar._

        ## Cómo verificar
        - `npm run typecheck && npm test`
    validations:
      required: true
