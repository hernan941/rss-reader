name: Funcionalidad o tarea
description: Un cambio pequeño y acotado, pensado para que lo resuelva el agente de Copilot.
title: "[feat] "
labels: ["feature", "copilot"]
body:
  - type: markdown
    attributes:
      value: |
        Cada issue debe poder resolverse en **un solo PR pequeño** (idealmente menos de 5 archivos).
        Si necesita más, divídelo. Un issue ambiguo cuesta créditos de agente en iteraciones perdidas.
  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: Completa cada sección, o borra todo y pega el issue completo (por ejemplo, uno escrito con Claude).
      value: |
        ## Contexto
        _Por qué se necesita y qué hay hoy en el código (menciona archivos o funciones concretas)._

        ## Qué hay que hacer
        _Descripción concreta y sin ambigüedad del cambio. Si hay una decisión de diseño, tómala aquí._

        ## Test que debe fallar primero
        _El test que fallará contra el código actual (archivo, caso y entrada concreta), agregado en un commit `test:` antes de la implementación; o 'No aplica' si es solo UI/CSS, docs o tests._

        ## Criterios de aceptación
        - [ ] 
        - [ ] `npm run typecheck` pasa
        - [ ] `npm test` pasa

        ## Archivos probables
        _Archivos que probablemente hay que tocar o crear._

        ## Fuera de alcance
        _Lo que el agente NO debe tocar ni "aprovechar para mejorar"._

        ## Cómo verificar
        _Comandos y comportamiento esperado para comprobar que está bien hecho._
    validations:
      required: true
