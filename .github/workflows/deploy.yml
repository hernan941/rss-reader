# Despliegue a Cloudflare al hacer merge en master (o a mano con "Run workflow").
#
# Secretos necesarios (Settings > Secrets and variables > Actions, o en el entorno `production`):
#   CLOUDFLARE_API_TOKEN   token con permisos "Workers Scripts: Edit" y "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta de Cloudflare
# ADMIN_EMAILS (y INVITE_CODE) ya son secretos de Cloudflare; el despliegue no los necesita.
#
# MIGRACIONES: se aplican solas al hacer merge en master, justo antes de desplegar
# (`wrangler d1 migrations apply DB --remote`). Solo corren las nuevas: wrangler registra
# las ya aplicadas en la tabla d1_migrations. Si una falla, el job se detiene y no se despliega.
# Como el código viejo sigue sirviendo mientras se migra, deben ser retrocompatibles
# (aditivas: agregar, no renombrar ni borrar). La persona revisa el SQL en el PR; el job
# `check` de ci.yml rechaza editar/borrar migraciones existentes y SQL destructivo
# (salvo la etiqueta `migracion-destructiva` en el PR).
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Sin cancelar: un despliegue a medias es peor que uno en cola.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Aplicar migraciones de D1
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CI: "true" # modo no interactivo: wrangler no pide confirmación
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Desplegar
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
