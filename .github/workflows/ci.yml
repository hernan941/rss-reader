# Comprobaciones de cada PR y de cada push a master.
# El job `check` es el estado obligatorio de la protección de la rama master.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # En PRs hace falta el historial para comparar migraciones con la rama base.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Revisar migraciones
        if: github.event_name == 'pull_request'
        run: node scripts/check-migrations.mjs origin/${{ github.base_ref }}
        env:
          ALLOW_DESTRUCTIVE: ${{ contains(github.event.pull_request.labels.*.name, 'migracion-destructiva') && '1' || '0' }}
